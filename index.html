const LOCAL = [
  {tab:'И грянет гром', title:'И грянет гром', paras:[
    [0,'Вы сидите в пустом зале для совещаний. Помимо вас троих, в комнате скучковавшись сидит экипаж БМП в полном составе. Шесть человек, тем не менее, никак не могут перебить давящую пустоту огромного зала. Неизвестно, сколько прошло времени, прежде чем высокая фигура в форме развеяла эту пустоту, распахнув дверь. Майор Крылов подошёл к столу и включил на проекторе какую-то карту.</br></br>Крылов: «Товарищи бойцы. Нам только что сверху дали приказ вспороть логистическое брюхо противника. Наш район действий — Пюлпло-, Пьюсш-, Пюшплек-… Твою мать, ну и слово ж венгры выбрали, блять. Пюшпекладань, северо-восток Венгрии. Там, на 34-й высоте, расположен перевалочный пункт снабжения противника. Наша задача — незаметно проникнуть в тыл, захватить базу, уничтожить радары и удержать эту позицию до подхода основных сил. Соблюдаем режим максимальной скрытности. Вопросы?»</br></br>Пташкин: «Нас туда одним отрядом отправят?»</br></br>Крылов: «Нет. По плану действовать будет лишь ваш отряд. На прикрытие и пожарную команду сведут ещё взвод десанта, но сильно рассчитывать на их поддержку не стоит — при случае они будут прикрывать наш отход».</br></br>Сомов: «Нам же пиздец. Один взвод в самом тылу на штурме базы — самоубийство. Так ещё и потом держаться хер знает сколько».</br></br>Крылов: «Согласен. Именно поэтому туда и направляют суперсолдат. Тем не менее удерживать вам придётся недолго — радарные станции в регионе стоят только у этой базы. Остальные комплексы тактического ПВО будут перегружены дронами. Так что после занятия базы держаться придётся не более суток, потом 34-й полк десанта прибудет к вам вертолётами. Помимо этого, разведка докладывает, что войск в Венгрии немного — самая большая группировка как раз в районе базы, так что на существенное подкрепление противнику рассчитывать не стоит. План дерзкий, но кто не рискует — не берёт Будапешт»'],
    [0, 'Крылов: «Снабжение будет ограничено, сами понимаете. Смету я уже выдал снабженцам, так что кому интересно, что там будет, — обращайтесь к товарищу Гуляеву. Заодно, может, себе мешок для трупов покрасивее присмотрите».</br></br>Сомов: «Я клянусь, если нам опять под задачу поломанную рухлядь выдадут…»</br></br>Белкин: «Да ладно тебе, прорвёмся».'],
    [0, 'Крылов: «Выдвигаемся через три дня, в полпервого ночи. Соберите всё необходимое. Нас выбросят где-то в Трансильвании, а дальше — своими силами, на колёсах. Вольно».</br></br>На этих словах грузный майор покинул комнату. Коренастая фигура в шлемофоне встала со стула, потянулась с хрипом и выдала: «Кто куда, а я в столовку. Вы со мной?» Оглядев товарищей и не найдя поддержки, мехвод лишь ухмыльнулся и удалился. Двое других экипажников также вышли в дверь, но уже без намерения следовать за своим водителем.'],
    [2,'Исраэль, тяжело вздохнув, таки направился в столовую вслед за мехводом'],
    [0,'Исраэль направился в столовую. Пройдя длинный коридор, Битон вошёл в просторный зал, откуда пахнуло какао, разведённым в огромной кастрюле, тёплой кашицей и запеканкой. Высокие светлые стены, выкрашенные, как в подъезде, зелёной краской, украшали плакаты о пользе правильного питания и необходимости мыть руки. Столы были пусты — разве что, дай бог, суммарно два отряда бойцов вкушали различные яства. Среди них был и Пташкин. Где-то из кухни доносился стук и грохот посуды, убираемой после плотного обеда.'],
    [2, 'Исраэль быстро получил свои харчи и направился к свободному столу, сев за который, с аппетитом принялся есть свою некошерную пищу. Ням-ням-ням.'],
    [3, 'Игорь, чуть погодя, пошел вслед за Исраэлем. Войдя в столовую, он подумал только одно: "Я хочу Вкусно и точка" . Взяв полноценный перекус сел за стол со своим отрядом.'],
    [1, 'Щелочков сидел и выслушивал задачу. Возмущения "колесных" вызывали лишь легкую улыбку. В мыслях: снова серьёзная задача и снова вести в бой людей. Как только Крылов покинул комнату, ст.лейтенант встал со стула и направился в сторону столовой вместе со своими.  Прийдя в столовую Щелочков направился к столу раздачи еды. Взяв поднос для еды он направился к салатам. Оттуда он взял салат столичный, поставив пиалочку с ним себе на поднос. Подойдя к горячим блюдам Илья попросил повариху налить ему соляночки, положить гречку и тушённую говядину. Повариха улыбнулась, взяла тарелку, зачерпнула половником свеже сваренную гречку и положила ее на тарелку. Затем она открыла емкость с говядиной и уже щипцами взяла два кусочка говядины и положила сверху на гречку. Для полноты и вкуса повариха добавила подливки от этой говядины полив ложечкой на тарелку.  Сотрудница столовой подала тарелку с гарниром и переключилась на первое. Илья забрал тарелку и поставил ее на красный поднос. Открыв кастрюлю наваристой солянки, из которой шел пар, она взяла половник и суповую тарелку. Зачерпнув половником суп она тут же перелила его в тарелку. Красный суп переливался золотистыми бляшками и были видны кусочки копченностей, овощей и даже кусочек лимона. Налив еще 2 половника, повариха протянула тарелку с супом старшему лейтенанту. Илья взял тарелку с горячим супом и поставил на поднос. Повариха отошла от раздачи, а Щелочков направился к напиткам. На столе стояли кружки с пакетиками, стаканы с компотом и киселем.  Илья не раздумывая взял себе стакан с киселем и тут же не раздумывая чуть отхлебнул из него. "Вишневый" подумал лейтенант и слегка улыбнулся.  Стакан с киселем переместился на поднос. Илья переключился на кружки с пакетиками(вот тут я вышел из трамвая). Выбрав себе черный чай с бергамотом, кружка так же отправилась на поднос. Загрузив поднос всем нужным Щелочков сел недалеко от моек. Аккуратно поставив поднос лейтенант сел за стол.  Вспомнив что забыл ложку и вилку, встал из за стола и отправился к началу раздотчного стола. Взяв там ложку и вилку он вернулся за стол. Илья взял ложку и погрузил ее в суп. Ложка утонула внутри супа и практически сразу же всплыла с кусочками копченностей и овощами. Наполненая ложка сразу же отправилась в рот товарища лейтенанта.  Скоро с супом было покончено и Илья, облизав ложку, принялся за второе. Расыпчатая гречка только так падала с вилки на тарелку с мясом и подливой. Доказав свою способность к графомании лейтенант окончил со вторым, выпил кисель, а затем чай. После такого приятного и сытного обеда старлей направился в кубрик чтобы вздремнуть и отдохнуть перед боем.'],
    [0, 'Дело близилось к вечеру. Полуденная дремота развеялась шумом солдат, вернувшихся с учений. Душевые кабинки в такое время — место похуже 67-го автобуса: много потных людей и мало места. Этот гам могли перебить лишь двое — прапорщик, громогласно отчитывающий очередного бедолагу за потерянную вещь, и чёткие, громкие, быстрые выкрики, похожие на выстрелы, майора-начмеда, отправляющей своих подчинённых по делам с другими бедолагами, что умудрились получить ранения на полигоне. Толпа постепенно рассеивалась, а столовая напротив — заполнялась. Всё шло своим чередом, ничего нового. Однако что-то всё равно было иначе. Первая боевая задача суперсолдат. Не только отряда — а всего человечества. Предстояло прорубить путь в деле. Невероятный груз ответственности и предвкушения спирал всех причастных — от офицеров и генералов вплоть до рядовых и помощников.'],
    [1, 'Услышав стук в дверь лейтенант спрыгнул с кровати и подошел к двери. Взявшийсь за ручку двери, открыл ее и увидел....'],
    [0, 'Солдат: «Здравия желаю, товарищ старший лейтенант!»</br></br>Перед тобой стоит молодой паренёк, не больше двадцати лет, в форме, явно на пару размеров больше его. Правая рука согнута к виску в положении «отдать честь». Он смотрит на тебя большими глазами, ожидая твоего действия.'],
    [1, 'Щелочков в ответ выполняет воинское приветствие, затем когда солдат убрал руку, сделал то же самое.</br></br>-В чем дело? —Смотря на солдатика спросил старлей'],
    [0, 'Солдат: «Товарищ Крылов просил вам передать, что генерал Батяев завтра прибудет в нашу часть. Требуется к десяти утра собрать всех солдат отделения, включая ГБМ, на плацу и быть с иголочки», — протараторил рядовой на одном дыхании, опустив руки почти по швам, с чувством выполненного долга.'],
    [1, '-Есть быть с иголочки.—Щелочков отходит от дверного проема и садиться на нижний ярус кровати.—Боец, не в службу, а в дружбу, найди мне моих балбесов. МлАдшие лейтенанты Битон и второго забыл. Оба "Богатыри". Если вопросов и сообщений нет, то можешь идти.'],
    [0, '— Есть найти бойцов! — отчеканил солдат, крутанулся на пятке и быстрым шагом удалился по коридору.</br></br>У аккуратной бледно-голубой двери он притормозил, одёрнул форму, выпрямился до хруста в спине, встал в уставную стойку — и постучал.'],
    [2, 'Бойцу никто не открыл...Исраэль с диким кайфом доедал купленные в буфете эклеры, временами бросая брезгливые взгляды на Игоря...'],
    [0, 'Солдат постоял ещё с минуту, потом постучал снова. И опять. Подергал ручку – заперто. Поняв, что ловить здесь нечего, безымянный парнишка двинулся к следующей двери. Там – та же картина. Никого.</br></br>Он развернулся, пробурчал себе под нос "пу-пу-пу" и потопал дальше.Проходя мимо дневального, поинтересовался, куда подевались лейтенанты из отряда "Богомол".</br></br>— "Да я-то откуда знаю? Слежу, что ли, за ними? Выходили из казарм часа четыре назад – и всё."</br>— "Чёрт. И куда они могли пойти?"</br>— "Да хер его знает. Чего ты ко мне прикопался-то?"</br>— "Да я ж просто спро…"</br>— "Просто он. Шагай отсюда, простак."</br></br>Отступив от столь высокоинформативного диалога, рядовой отправился бродить по части. Минут двадцать он обыскивал каждое здание, каждую комнату – будто вражеский шпион, собирающий данные. И вот, переступая порог обители съестных припасов, солдат замечает объекты своего поиска. Поправив форму, расправив плечи, он строевым шагом сблизился со столом лейтенантов и громко выпалил:</br></br>— "Товарищ младший лейтенант Битон! Товарищ младший лейтенант Сеняк! Старший лейтенант Щелочков просил вас собраться у него в комнате!"</br></br>И застыл с рукой у виска, внимательно поглядывая то на одного, то на другого офицера.'],
    [2, '— "В ногах правды нет, дружище, присаживайся" - Исраэль указал бойцу на свободный стул - "сегодня ахуенная запеканка, жаль, только этот заглот всё сожрал..."'],
    [0, 'Солдат растерянно помычал, пожал плечами и аккуратно присел с краю – на самый краешек скамьи, будто боялся занять чужое место.</br></br>— "Ну, эт самое… вас там ждут, как бы…" — сказал он неуверенно и тут же втянул голову в плечи, поняв, что вышло не по-уставному.'],
    [2, '— "Война войной, а обед по расписанию".'],
    [0, '– "Ага… точно" – Он замялся, потом кивнул сам себе. – "Мне мама то же самое говорила. Только… товарищ лейтенант, а если мы завтра к десяти не успеем? Ну, я про генерала. Я ж не знаю, как оно там, на этой войне…" – Он осёкся, покраснел и уставился в стол. – "Тьфу, дурак. Не то говорю. В общем, зовут вас... Обоих. Разрешите идти?"'],
    [2, '— "Иди, боец. А ты, заглот, жри быстрее. Щелочков вечно ждать не будет".'],
    [0, 'Сафонов подскочил так резко, что скамья скрипнула. Чуть не потерял свою кепку – поймал на лету, прижал к груди, надел на себя аккуратно, будто извиняясь перед ней.</br></br>– "Есть идти!" – выпалил он, шагнул к двери и вдруг развернулся.'],
    [2, 'Исраэль проводил бойца взглядом, тихо пробормотав:</br></br>—"Да...не еврей ты, Сафонов..."'],
    [3, 'Игорь , допивая горький как его жизнь чай.  Негромко топнул ногой и провожая взглядом доложившего им новость солдата. Направляясь к запутанному расположения части, который Игорю казался просто лабиринтом, где непременно нужно было искать своего командира.'],
    [2, 'Пробираясь по однотипным коридорам, тёмным, как перспективы в жизни Игоря и Исраэля, они добрались до своего командира...............'],
    [1, 'Пока такая душераздерающая сцена происходит в столовой. В кубрике Богатырей, Щелочков вместе с мехводом играют в дурака.</br></br>Игра проходит напряженно и то и дело с обеих сторон слышится мат и другие ругательства.'],
    [0, 'Щелочков сидит напротив Пташкина – спина прямая, локоть на столе, карты держит близко к груди, будто и не смотрит в них вовсе. Взгляд у него спокойный, тяжёлый. Он не торопится: сбрасывает карту, как приговор зачитывает, – без эмоций, без азарта.</br></br>Пташкин – полная ему противоположность. Развалился на стуле, комбинезон расстёгнут до пупка, шлемофон сдвинут на затылок. Карты держит веером у самого лица, щурится, шевелит губами – считает. Каждый ход сопровождается прибауткой:</br></br>– "О, а вот это я уважаю." – Хлоп картой по столу. – "Держи, командир, не скучай."</br></br>Щелочков молча накрывает. Пташкин крякает:</br></br>– "Ну ты и жук, товарищ старший лейтенант. Каменное у тебя лицо, я ж тебя не прочту никак. Мне б такое – я б в разведке служил, а не в железке сидел."</br></br>Проигрывает – хохочет, откидывается назад, хлопает себя по колену:</br></br>– "Во даёт! Вот ведь Сомов бы сейчас сказал: "Как обычно". А я скажу – везёт же некоторым" – И тут же тянется к колоде: – "Давай ещё. Пока не отыграюсь, из-за стола не выйду. У меня ж, эт самое, принцип."</br></br>И Пташкин раздаёт – с шутками, с прибаутками, с присказками про то, как он однажды в Челябинске в карты выиграл ящик сгущёнки и потом неделю её с чаем давил.'],
    [2, '— "Таки здравия желаю, товарищи. Позволите ли вы присоединиться к вашему празднику азарта и греха?"'],
    [1, 'Щелочков кинул две 6ки Пташкину, повесив ему на погоны, повернул голову и осмотрел бойца с ног до головы. </br></br>-А давно ли у нас богатыри пейсы носить стали? Давай жидяра, подваливай. Но учти...играем не на деньги'],
    [2, '— "Порядочный еврей таки никогда не выберет столь простой способ расстаться с деньгами, товарищ старший лейтенант". - с хитрой улыбкой Битон, потирая ручонки, устроился за столом. - "Заглот, ты с нами?"'],
    [0, 'Пташкин, увидев на погонах две шестёрки, сначала вытаращился, потом заржал так, что шлемофон съехал совсем:</br>– "Ох ты ж, ёлки-палки! Командир, ты б ещё мне на фуражку их прилепил!" – Он сгрёб шестёрки, повертел в пальцах, сунул в нагрудный карман. На появление Битона он обернулся, окинул его весёлым взглядом и хлопнул ладонью по столу:</br>– "Ба, таки кто пожаловал!" – Он подвинулся на скамье, освобождая место. – "Подваливай, подваливай, тут не кусаются"'],
    [3, 'Игорь, не сразу понявший что зовут его и  почему именно так . Тяжело вздыхая уселся на скамью.'],
    [0, 'Не дождавшись ответа, в комнату влетел Белкин – красный, запыхавшийся, с дверью так разошёлся, что та хлопнула о стену.</br></br>– "Птаха! Вот ты где! Тебя везде ищут!" – выпалил он с порога, тыча в мехвода пальцем. – "Давай быстрей в гараж, беху приписную готовить! Завтра генерал приезжает, ты что, не слышал?!"</br></br>– "Еперный театр!" – рявкнул Пташкин, швырнул карты на стол, так что они веером разлетелись, и поднялся. – "Извиняйте, государи, барин извозчика требует!" – Он отвесил шутовской полупоклон, придержал рукой шлемофон, чтобы тот не свалился, и выскочил следом за Белкиным – только дверь ещё раз хлопнула.'],
    [2, '— "Блять!" - крикнул Исраэль - "Почему именно когда мне такие карты достались?"</br></br>Еврей разочарованно отбросил карты на стол, поворачиваясь к Игорю: "Хули вылупился? Иди ты нахуй..."'],
    [1, 'Собрав карты в колоду, а затем в коробочку, Щелочков осмотрел бойцов.</br></br>-Товарищи бойцы!—Начал Илья—Вы должны понимать всю глубину наших глубин.'],
    [3, '—Выкладывай командир'],
    [2, '— "А вы нам по гражданским разрешите стрелять?"'],
    [1, 'Осмотрев не особо умных бойцов, Щелочков тяжело вздохнул и лишь проговорил: Триста тридцать пять...'],
    [1, '–Однако...однако....—Старлей немного покосился, оперевшись на стол локтем и тихо произнес.—Я думаю, нетоварищ жид, что если пару мадьяров исчезнут с этой земли по вашей вине, то я совершенно не замечу этого....–Щелочков замолчал и начал сверлить еврея взглядом.'],
    [2, '— "Ох уж этот ваш...русский шовинизм..."'],
    [1, '–А знаете почему я не замечу?—Щелочков выдержал паузу, а затем на весь кубрик сказал.—Потому что в этот момент я буду занят убийством мадьяров!—Щелочков распрямился и почти маниакально расмеялся'],
    [2, 'Исраэль покосился на всё ещё молчавшего за столом Игоря.</br></br>— "А с этим чё делать будем?"'],
    [1, 'Как только смех стих. Лейтенант встал со стула, убрал руки за спину и начал свою речь:</br>—Товарищи, богатыри. Завтра к нам едет ревизор...а точнее генерал Батяев. Считайте наш отец! И мы...—Чуть выпрямившись.—Мы не должны его разочаровать. Слушай мой приказ, т-щи бойцы! Подговить форму, снаряжение и оружие в самый лучший вид. На столько лучший, что даже заводское будет казаться грязным.</br>А на счет бойца...'],
    [3, 'Игорь слушал все это с лицом лица. Не понимал и странный интерес к своей персоне. И  не мог отойти от странной шутки командира. Понимал что это просто армейский юмор , но даже спустя столько лет у него что-то кололо внутри , и хотелось курить. </br></br>—Я-то выряжусь как на парад. Можете не сомневаться.Одно меня гложет , что проверка решила нагрянуть прям перед тем как мы с наскока должны взять  базу венгерскую.'],
    [1, 'Пиздец ты тупой. Не екнуло в голове ничего? Первый раз в истории всего человечества используют модифицированных людей! Естественно нужно торжественно подготовиться к этому.'],
    [3, '—Ладно.'],
    [2, 'Преодолевая пространственно-временной континиум при помощи секретного издания торы, Младший лейтенант Битон перемещается в прошлое, аккурат в нужный кабинет.</br></br>— Здравия желаю! Я умоляю вас выдать мне беспилотный летательный аппарат DJI Mavic 3T вместе с терминалом БПЛА CSAT, которые однозначно пригодятся мне при выполнении грядущей для отряда "Богомол" миссии.'],
    [0, 'Прапорщик, опешив от столь резкого — даже для этого дня — появления, удивлённо посмотрел на бойца:</br></br>— "Ты шо ж это, не видишь, тут какая запарка? Чего тебе, ты откуда такой?" — спросил он.'],
    [2, '— Младший лейтенант Исраэль Лазаревич Битон, отряд "Богомол". Нужны DJI Mavic 3T, аккумуляторы к нему и терминал БПЛА CSAT.'],
    [0, '— "Вас чоль, эт самое, посылать собираются?" — Гуляев почесал затылок под кепкой. — "Эвоно как. Ладно. Как говоришь, мавек? Это эти, дрындулеты, что ль? Ну, эт самое, посмотрю, что есть. Авось не будет — ну, извиняй, поищу что есть," — сказал он спокойно, без всякой обиды, и полез в свои бумаги.'],
    [1, '—Минуточку!-Щелочков ворвался к прапорщику с бумажкой в руках'],
    [0, '— "Ну те здрасьте, хер в томате!" — Прапорщик оторвался от бумаг, которые только что поднял, и уставился на вошедшего с раздражением. — "А ты кем будешь?"'],
    [1, '—Ст.лейтенат Щелочков. Отправляемся на боевую задачу, нужно оборудование, вот список:'],
    [0, '— "Аккумулятор — сто штук?" — Гуляев аж крякнул, отложил бумаги и уставился на просителя. — "Ты либо, эт самое, наглый, либо балбес. Сто штук ему! Да где ж я тебе сто возьму — с неба, что ль, натрясу? Будут вам дрыны ваши, будут. Вон, эт самое, твой иудей уже заговорился. Только, как его… ну не сто аккумуляторов, ну имей совесть! Парочку будет, а там…" — Он махнул рукой. — "Ну ты, эт самое, понимаешь… Не всё коту масленица. Ладно, давайте, не мельтешите, эт самое. Будет вам, будет." — Он отвернулся было, но тут же обернулся: — "И не мытьём, так катаньем, а своё получите. Всё, давайте." — И усатый прапорщик вернулся к беседе с сержантом о снабжении.'],
    [0, 'Вы тщательно проверяете снаряжение: натираете ботинки, гладите форму. Кое-как вам удаётся привести себя в приемлемый вид.</br></br>Только у Сеняка ничего не выходит. То ботинки в разводах, то утюг не берёт складки, то лычка подшита криво – вроде ровно приложил, а пришил косо. Он уже трижды перешивал, сопит, тычет иголкой в палец и шипит от досады.</br></br>Утром вы просыпаетесь. На часах – 8:34. Из-за закрытой двери до каждого доносится гул, гам и топот: вся часть суетится, пока вы отлёживаетесь. "Блять, не туда!", "Давай, давай!" и прочие выкрики едва различимы на фоне общего шума.'],
    [2, 'Исраэль медленно поднялся с койки и задумчиво произнёс:</br></br>- "Людей нет...где люди?.. И птицы затихли..."'],
    [1, 'Щелочков продрал глаза и отправился на зарядку. После небольшой разминки, лейтенант привел себя в чувства в душе и направился в кубрик, готовясь к прибытию Батяева.'],
    [3, 'Игорь проснулся от жуткого гама за дверью. Солнце слепило глаза. А пальцы всё ещё болели от промахов иголкой. Наконец собравшись с духом, он поднялся с койки. Готовиться к параду, первым делом, он естественно начал с уборной.'],
    [0, 'За всем этим шумом всё равно было слышно стук в дверь — и лёгкое ерзанье перед ним, будто тот, кто стоял снаружи, переминался с ноги на ногу и никак не решался постучать.'],
    [1, 'Заканчивая наряжаться, открываю дверь и смотрю кто пришел'],
    [0, 'Перед дверью стоял молодой солдат с наивным лицом в веснушках. Едва тебя увидев, он вскинул руку к виску и быстро протараторил:</br></br>— "Товарищ старший лейтенант! Товарищ майор зовёт вас к себе!"'],
    [1, '—Вольно. Выдвигаюсь.</br>Прохожу мимо бойца и выдвигаюсь в сторону т-ща майора. Проходя через коридоры и кабинеты я вижу...'],
    [0, 'Проходя через коридоры, Щелочков видит суету: отряды солдат в экипировке бегут строем, иные тащат какие-то ящики, третьи сверяют списки, а четвёртый — и вовсе экающий якут. Пройдя здание казармы, лейтенант выходит на улицу, где народу ещё больше и суета ещё гуще. Даже техника гудит своим низким басом и дымит, как депо паровозов. Двигаясь мимо плаца к зданию офицерской части, на просторной площади он видит, как строятся солдаты, а техника виляет пятой точкой, занимая своё место, — как кот в коробке. Всё идёт полным ходом. Едва открыв дверь и переступив порог, Щелочков слышит громогласное «Смир-р-р-но!» от дневального на тумбе. Второй этаж, кабинет 255. Тёмная каштановая дверь с резным узором квадратной формы'],
    [1, 'Стук в дверь и ожидания разрешения ответа. После получения разрешения Щелочков зашел в кабинет и исполнил воинское приветствие.</br>—Вызывали?'],
    [0, 'Крылов сидит за столом, вертит в пальцах шариковую ручку — быстро-быстро, туда-сюда. Лицо серьёзное, брови сдвинуты.</br></br>— "Проходи, Щелочков," — гудит он грузным басом. — "Надеюсь, информация про генерала до вас дошла. Подготовились?"'],
    [1, 'Убрав руку от виска, лейтенант вошел в комнату и доложил:</br>Так точно, подготовились! В лучшем виде, твщ майор'],
    [0, '— "Отлично, отлично…" — всё тише и тише повторял Крылов, будто сам себя уговаривал.</br></br>Потом отложил ручку, сцепил пальцы в замок и поднял глаза:</br></br>— "Через час у нас строй на плацу. Распорядок проверим да донесём до тех, кто ещё не знает. Вы там быть обязаны. И я обязан. Все обязаны. В лучшем виде — а иначе комчасти вздрючит сначала меня, потом тебя, а потом и всё ваше отделение. Ферштейн?" — Голос его поднялся, глаза впились прямо в Щелочкова.</br></br>Он выдохнул, откинулся было, но тут же спохватился:</br></br>— "А, и да. Ознакомьтесь со списком вашего снаряжения на грядущую задачу." — Он буркнул это и бросил на стол несколько листков, скреплённых степлером. — "Если чего хотите поверх — это уже напрямую к прапору обращайтесь. А там как повезёт," — с притворным пониманием произнёс он последнее, поправился в кресле, выпрямился и громко отчеканил: — "Вольно. Можете идти."'],
    [3, 'Выходя из душного нужника, Игорь обомлел. Будто бы впервые вдохнув свежий воздух и заново родившись. Последние полчаса на туалете многие бы люди сравнили бы с перерождением. Настолько отрезвляющего опыта у Игоря никогда не было. Белый чистый сифон, который был на начало акта, никогда больше не станет чистым. Воспаря аки феникс после дефекации, он подтёрся чистой, будто слеза младенца, бумагой. Булками он чувствовал каждый слой (их было 4 и со вкусом ромашки). Единственным свидетелем его действий был еле живой ершик. Запах. Он был. Игорь оделся в форму, направился на построение'],
    [0, 'Выйдя за дверь, Сеняк увидел абсолютно пустой коридор. Тем не менее звуки шума и гама всё ещё стояли в ушах — оглушительные, будто рядом толпа. Он двинулся дальше по казарме к выходу и не встретил ни души. Шум никуда не делся, будто здесь должна была быть толпа — а её нет. Всё, что сопровождало его, кроме этого непонятного звука, — бесконечно длинный коридор.</br></br>Дойдя до конца и выйдя на улицу, Сеняк наконец увидел солдат: все уже стояли на плацу в построении. С облегчением он подошёл ближе — и обмер. Это были не солдаты, а безликие манекены в форме. А техника, оглушавшая своим рёвом, оказалась всего лишь деревянными макетами.</br></br>Двигаясь в сторону штаба, боец ещё раз взглянул на деревянное войско — ничего не изменилось. Войдя в штаб, Сеняк сразу окунулся в густую тишину. Тишину и приглушённый, полутусклый свет. Даже на тумбе дневального никто не стоял. У информационной стойки единственное, что он смог разглядеть, — фиолетово-белое информационное оповещение с большими чёрными буквами: «Не забудь».</br></br>Поднявшись на второй этаж, он обнаружил, что свет практически исчез, а тьма будто уже приняла физическое очертание и форму.</br></br>Взглянув ещё раз в окно, Сеняк увидел, что все манекены исчезли.'],
    [3, 'Игорь проверил толчок  вдруг он там что-то забыл'],
    [0, 'Спустившись вниз и выйдя на улицу, Сеняк направился назад в казармы. Внутри его встретило уже привычное давление шума. Дойдя до своей комнаты и открыв дверь, он обнаружил всё как было. Разве что с лампой на другом конце комнаты творилось что-то не то — что-то в ней было не так.'],
    [3, 'Игорь захотел осмотреть лампу.'],
    [0, 'Вглядевшись в лампу, Сеняк всё никак не мог понять, почему она выглядит столь ненатурально. Затем, опустив глаза ниже, он увидел: дело не столько в лампе, сколько в тени — она была неправильной. Тень от лампы падала так, будто на неё светит солнце в четвёртом часу дня, — продолговатый тёмный силуэт ложился на тумбу возле кровати вместо того, чтобы отбрасывать небольшую тень на стену.</br></br>Чем больше лейтенант вглядывался в лампу, тем сильнее звенело в ушах. В глазах тоннель становился всё шире и шире.</br></br>Разом, резко — удар. Потолок с грохотом рухнул. Тишина.</br></br>Тишина.</br></br>Темнота.</br></br>Сеняк открыл глаза.</br></br>Он лежал в своей постели, в своей комнате. За дверью раздавался шум. Лампа была обычной.'],
    [3, 'Игорь захотел ущипнуть себя , чтобы проверить реальность или нет'],
    [0, 'Игорь щипнул себя. Больно. И почему-то приятно. Зачем-то лейтенант решил ущипнуть себя за сосок — и тут же отдёрнул руку, огляделся по сторонам, точно кто-то мог увидеть.'],
    [3, 'Игорь решил поискать оружие , и пойти в столовую'],
    [0, 'Игорь нашёл свою винтовку и — в шлёпанцах, немытый, в одних трусах да майке — пошёл в столовую. Однако на пути из офицерской казармы ему встретился полковник Морозов. Командир части уставился на эту живописную картину, подлетел мухой и спросил:</br></br>— "Это куда вы в таком наряде собрались, товарищ младший лейтенант?"'],
    [3, 'Игорь, все еще в шлёпках.Отдал честь.</br></br>— Вы мне снитесь полковник. А я на парад иду. Генерала встречать. Пусть глотку не рвет, а угостит лучше.'],
    [0, 'Полковник постоял ещё пару секунд с удивлённым лицом — то ли от наглости бойца, то ли от того бреда, что этот боец выдал, переваривая услышанный нонсенс. Потом спокойным тоном произнёс:</br></br>— "Ну что ж, раз это сон…" — неторопливо протянул Морозов, выхватывая винтовку из рук лейтенанта. — "…то вот вам небольшой сюжет для сна," — энергично проговорил он, вытаращив глаза на подчинённого и слегка нагнувшись. — "Сейчас ты, спящая моя красавица, отправишься к доброму дяде-хранителю, что сторожит бескрайние просторы хозтоваров," — с завыванием описал он, будто имитируя эхо, и приобнял солдата за плечи одной рукой. — "И получишь у него жезл очищения кошмаров. После, с этим скипетром тебе предстоит шагнуть в самую страшную часть царства Морфея и вычистить отхожие обереги, что принимают в себя отхожую нечисть всех прекрасных фей этого места." — Он остановился, убрал руку и вытащил маркер из кармана: — "А чтобы тебя, мой воин, узнал каждый обитатель сонных мест — как героя, разумеется, — мы тебя пометим."</br></br>И написал у лейтенанта на лбу большими буквами слово «СПЛЮ».</br></br>— "Понял меня, Ленин?" — резко повысил голос командир. — "А автомат твой я отдам тогда, когда ты мне сдашь свою работу. А сдать ты мне ее должен до пострения, а именно" — посмотрел на свои часы Полковник — "через полтора часа. Услышал?"'],
    [3, 'Игорь ,выслушал полковника Морозова со спокойным и почти безучастным видом, с каким выслушивают длинную и не совсем понятную речь, заранее зная, что возражать бесполезно, а исполнять всё равно придётся. Когда же полковник закончил  свои слова о жезле очищения кошмаров, об отхожих оберегах и о нечисти всех прекрасных фей, Игорь только вздохнул, поправил шлёпанцы и, не сказав ни слова, пошёл туда, куда ему было указано, то есть к доброму дяде-хранителю бескрайних просторов хозтоваров.'],
    [0, 'НачМТО сидел за столом в своём кабинете, смотрел телевизор и покуривал сигарету. Когда к нему вошёл солдат в одной футболке, трусах и шлёпанцах, с надписью «СПЛЮ» на лбу, тот даже не сразу поверил, что сам не спит.</br></br>— "Мать честная…" — Гуляев медленно вынул сигарету изо рта, отставил её в пепельницу и привстал. — "Это что ж с тобой приключилося, эт самое? Ты откуда такой взялся-то, горе луковое?" — Он обошёл стол, оглядел бойца со всех сторон, будто диковину какую.'],
    [3, '- Товарищ Прапорщик ,младший лейтенант Сеняк по личному вопросу прибыл. Разрешите , мне нужна:  швабра ,тряпка , моещее средство , перчатки , губка , пачка принглс. Личный приказ Полковника Морозова.'],
    [0, '— "А, так вот оно что. Ну это всё объясняет," — расхохотался прапорщик, хлопнув ладонью по столу. — "Видать, ты сильно накосячил, боец."</br></br>Смех оборвался так же резко, как и начался. Гуляев перевёл взгляд на бойца, посерьёзнел и спросил:</br></br>— "Эт самое, что такое прингалс? Что за пачка?" — Вопросил завхоз и остановился у двери на склад, положив руку на ручку.'],
    [3, '- Неважно, не надо , спросите потом детей.'],
    [0, '— "Вот что, боец," — серьёзным тоном сказал добродушный прапорщик. — "Если не хочешь мне говорить, что это, — не получишь. Как иначе я, эт самое, искать-то буду это самое?"</br></br>Сказав так, он удалился на склад. С минуту лейтенант слышал шаги, шорох и звон, прежде чем завхоз вернулся и вручил ему потёртую бутылку моющего средства — явно использованного уже не в первый раз, — металлическое ведёрко, тряпку, губку и пару резиновых перчаток.</br></br>Едва лейтенант потянулся за принадлежностями, как услышал:</br></br>— "Стоять! Куды ручонки тянем? Сначала расписаться!" — заявил Гуляев, заканчивая писать в журнале. Затем развернул его и протянул ручку бойцу.'],
    [3, 'Игорь взял ручку, и размашисто поставил свою подпись, ту, которую придумал еще для паспорта.</br></br>— Разрешите откланиться?'],
    [0, '— "Вот теперь можно" — кивнул Гуляев и убрал руку в сторону, освобождая проход к принадлежностям.'],
    [3, 'Игорь пошёл к отхожим местам, которые полковник назвал оберегами, и принялся за работу. Работа была нехитрая, но времени требовала, и Игорь, не привыкший откладывать, делал её старательно, хотя и без особого воодушевления. Он мыл, тёр, выливал, снова тёр и снова выливал, и в какой-то момент ему показалось, что он и в самом деле очищает не просто помещение, а некое царство Морфея. Надпись «СПЛЮ» на лбу ему мешала, пот заливал глаза, и он несколько раз провёл по лбу мокрой тряпкой, отчего буквы побледнели, но не исчезли окончательно, а стали похожи на странный знак, смысл которого был известен только Морозову и Гуляеву .'],
    [0, 'Сеняк быстро и ловко отдраил гальюн офицерской казармы так, что даже туалет у него дома никогда не выглядел. А самое главное — вовремя успел.</br></br>В комнату вошёл полковник.</br></br>— "Мой-додыр моего сердца, как успехи?" — язвительно, резко заявил Морозов. — "Я могу уже найти кусочек мяса в зубах, смотрясь в писсуар?"'],
    [3, '— Смотря что ели полковник. Могу идти на построение ?'],
    [0, 'Морозов хмыкнул, оглядел уборную — от блеска писсуара аж глаза заломило, — потом перевёл взгляд на бойца, и в уголках губ у него дёрнулась усмешка.</br></br>— "Смотря что ели…" — повторил он, будто пробуя фразу на зуб. — "Острым языком, товарищ лейтенант, вы себе когда-нибудь гланды порежете." — Он шагнул к одному из писсуаров, провёл пальцем по краю, посмотрел на палец, кивнул сам себе. — "Но чистенько, чистенько. Уборщиком тебе надо быть, а не офицером армии. Хоть тут" — сделал драматическую паузу комчасти — "соответствуете" — Полковник выпрямился и сунул руки в карманы. — "На построение можете идти, товарищ золушка. Только вот что, мой-додыр: надпись со лба сотри. Иначе на плацу тебя за нового маскота части примут." — Он уже развернулся к выходу, но на пороге обернулся: — "И запомните, лейтенант: язык — он как штык. Иногда помогает, а иногда — в задницу. Свободны."'],
    [0, 'На площади у зданий части стояла вся рота. За полотном из людей красовались несколько отобранных машин, которые выглядели поприличнее. Там же находилась и БМД-4 экипажа Белкина.</br></br>— "Товарищи бойцы" — начал громогласно, но спокойно Морозов. — "Как вам уже известно, а кому неизвестно — тот лжёт, сегодня к нам в часть приезжает генерал. Наша задача…" — Он вдруг недовольно осмотрел толпу. — "…выставить себя не совсем уж полными придурками. Да, можете не говорить, я согласен с вами, что задача эта близка к невозможному, но всё-таки! А иначе как нам будут выделять снабжение?" — уже чересчур эмоционально продолжал полковник. — "Именно по этой причине, а также исключительно по волеизъявлению каждого солдата, я никого не отпускаю сегодня в увал в город. Будь вы хоть моим сыном."</br></br>Тут резко раздался голос из рядов.</br></br>— "Даже меня?" — неуверенно, но громко выкрикнул кто-то.</br></br>Морозов с огромным интересом и любопытством уставился в сторону, откуда донеслись слова, и ответил:</br></br>— "Даже тебя, безымянный дух толпы. Шаг из строя, таинственный «меня»."</br></br>— "Погадагин меня зовут" — ещё более неуверенно, но всё так же громко промямлил солдат, пробираясь сквозь толпу.</br></br>— "А кто ты мне, родственник, что ли?" — язвительно ответил полковник.</br></br>— "Ну как... да…" — совсем скис Погадагин, втягивая голову в плечи.</br></br>По толпе пронёсся смешок.</br></br>— "Отставить, уродливые зелёные человечки!" — отрезал Морозов, а затем продолжил: — "Интересно было бы узнать, как это так получилось, что ты мне родственник?"</br></br>— "Ну мы же с вами братья… по оружию…" — громко говорил рядовой, глядя себе под ноги, будто хотел голосом прорезать дыру в плацу и провалиться сквозь землю.</br></br>— "А знаешь что? А ты прав!" — задорно, с издевкой сказал комроты. — "А поскольку ты прав и ты мой брат, то я так и быть, отпускаю тебя сегодня на весь день в город. И ты ни при каких обстоятельствах не должен возвращаться назад." — Он растягивал слова, играя лёгкой издевкой в голосе.</br></br>— "П-правда?" — заулыбался Погадагин.</br></br>— "Правда!" — резко и зло ответил Морозов. — "А теперь брысь из части, и чтобы до отбоя я тебя тут не видел. Свободен!"</br></br>Погадагин, не чуя никакого подвоха, весело гаркнул:</br></br>— "Есть!" — и вприпрыжку посеменил к казармам.</br></br>Затем полковник ещё полчаса красочно и с подробностями описывал распорядок дня и в каких позах этот распорядок он будет делать с солдатами.'],
    [0, 'Прошло пару часов, и теперь все солдаты вновь стоят на тех же местах. Ворота открываются. Оттуда показываются три фигуры: две высокие и одна низкая. Один из них — сам полковник Морозов, а низкая фигура с пышной седой бородой — генерал Батяев.</br></br>Подойдя к строю, полковник скомандовал:</br></br>— "Смирно!" — и резко отрезал: — "Товарищ генерал-лейтенант, третья спецрота построена!"</br></br>Генерал ответно отдал честь, махнул рукой и спокойно сказал:</br></br>— "Товарищи бойцы, мне приятно видеть столько людей, желающих верно служить нашей родине…"</br></br>Убаюкивающим, почти бархатным голосом с хрипотцой генерал зачитывал воодушевляющую речь, которая сильно контрастировала с речью полковника, толкаемой чуть ранее в идентичных условиях.</br></br>— "…Также с сегодняшнего дня к вашей роте прикрепляется полковник Лапин," — и указывает рукой на улыбающегося солдата в идеально выглаженной форме. Лапин, когда его представили, заулыбался ещё шире и чуть поклонился. — "…Он будет куратором по вопросам безопасности и оперативной работы вашего соединения," — продолжал убаюкивать генерал.</br></br>Закончив предложение, генерал указал рукой жест Лапину, и тот начал свою речь с воодушевлённого:</br></br>— "Друзья! Именно так, ведь все мы здесь не чужие люди! И меня чужим тоже считать не надо. Я такой же солдат, как и вы. Я тоже бегал в штурмовиках и стрелял, вот это вот всё…" — крайне энергично и в шутливой манере продолжал полковник, пытаясь расположить к себе людей. — "Я здесь, чтобы помочь вам. Ни в коем случае не стучать — не подумайте!" — Он сделал жест манерного отвращения и продолжил: — "Я здесь исключительно для того, чтобы враг не смог пустить свои корни в столь перспективную роту! А как вам известно, эта рота укреплена передовой силой, я бы даже сказал — настоящими супергероями! Так что следить за врагом здесь крайне необходимо."</br></br>Далее, после ещё каких-то речей — как от генерала, так и от нового полковника, — солдаты из числа роты отправились демонстрировать генералу свою подготовку на всевозможных тестах: начиная от физнагрузок и заканчивая сборкой и разборкой автомата Калашникова.</br></br>Майор Крылов, что стоял спереди от отряда «Богомол», развернулся к бойцам и сказал:</br></br>— "Слушайте, у вас есть где-то час подготовиться. Генерал хочет оценить и ваши навыки в том числе, как только разберётся с остальной ротой. Не смейте опозориться."'],
    [0, 'Суперсолдаты сидели на лавочке в небольшом скверике за зданием склада и по-суперсолдатски обсуждали свои суперсолдатские дела. В этот момент к ним подходит генерал, два полковника и майор.</br></br>Морозов громко начинает речь, чтобы прервать бурную беседу бойцов:</br></br>— "Любезный генерал, любезный полковник, разрешите мне вам представить наш magnum opus по проеданию денег налогоплательщиков — суперсолдат!" — Затем повернулся к беседующим и яростно крикнул: — "Стройсь, многоклеточные!"</br></br>Полсекунды на реакцию — и солдаты уже стоят шеренгой перед так называемой комиссией.</br></br>— "Вольно, тебе слюнями брызгать, полковник — не просто ж так делается это всё," — спокойно ответил генерал. — "Ну что, сынки, меня кличут Батяевым, Петром Ильичом. А вас как?" — С улыбкой на лице, всё так же медленно и бархатно говорил Батяев, протягивая руку всем по очереди, начиная с командира.'],
    [1, 'Четким голосом:</br>-Здравия желаю, товарищ Генерал! Старший лейтенант Щелочков! Командир отряда. Настрой боевой, ждем не дождёмся бить врага. Доклад окончен</br></br>Илья выполнил воинское приветствие и встал по стойке смирно. Он ожидает что остальные товарищи так же торжественно поприветствуют генерала.'],
    [2, '— Здравия желаю, товарищ Генерал. Младший лейтенант Битон. С нетерпением ожидаю возможности приступить к поставленным задачам.</br></br>Следуя примеру своего командира, Исраэль по заранее заготовленной анимации выполнил воинское приветствие, после встав по стойке смирно.'],
    [3, 'Сеняк молча пожал руку, сопроводив это почтительным кивком.'],
    [0, '— "Так, солдаты, покажите, что умеете" — сказал Батяев. Затем генерал повернулся к Лапину и задорно вопросил: — "С чего начнём, товарищ полковник?"</br></br>— "Спасибо за оказанную честь выбрать, конечно" — не снимая улыбки с лица, полковник сыграл смущение. — "Но мне кажется, что солдаты сами могут выбрать, с чего начать" — Лапин повернулся к Морозову: — "Товарищ полковник, могу я вас, пожалуйста, попросить вновь озвучить тесты для нас?" — дружелюбно вопросил он.</br></br>— "Подтягивания, отжимания, бег на тридцать метров, сборка-разборка Калашникова" — сухо и быстро проговорил комроты. — "Выбирайте" — И манерно наклонился к группе бойцов, театрально вычурно сыграв вопросительную интонацию.'],
    [3, 'После слов Батяева . Не дожидаясь отмашки  командира . Игорь моментально упал в положение упор лежа. Ладони он поставил твёрдо, чуть шире плеч, носки упирались в землю, спина вытянулась в одну прямую линию, и во всей его фигуре не было ни напряжённости, ни той небрежности, какие обыкновенно бывают у обычных людей. Он лежал так несколько секунд, будто примериваясь к земле, потом медленно согнул руки, опустился почти до самой земли и так же ровно, без рывка, поднялся.</br>— "Остановлюсь когда прикажете" </br>Тихо сказал Игорь.'],
    [0, 'Батяев и Лапин удивлённо переглянулись, лицезрея действие бойца. У Батяева брови поползли вверх, а Лапин так и застыл с приклеенной улыбкой, будто не мог решить, смеяться ему или хмуриться.</br></br>— "Отставить толкать Землю!" — гаркнул Морозов на лейтенанта в упоре лёжа, и голос его раскатился по плацу. — "Сейчас с орбиты её сведёшь — в космос полетишь возвращать! Без скафандра и с метеоритом в заднице!" — Продолжал орать полковник, багровея, и даже притопнул для убедительности.'],
    [3, 'Игорь поднялся, и отдал честь.</br>- " Есть отставить толкать "'],
    [0, '— "Я тебя буду называть Лунтиком" — неожиданно спокойно, с переигранной интонацией произнёс Морозов. — "Потому что ты тоже как с Луны свалился." — И тут же резко сорвался обратно на крик: — "Темечком на фугас!"</br>Затем полковник развернулся к остальным бойцам и с жалеющим взглядом проговорил вполголоса:</br>— "Почему ж вам силу дали, а ума — нет."</br>Морозов переориентировался лицом к комиссионной группе и заявил язвительно, но с сожалением:</br>— "Вот такие контуженные у нас оловянные солдатики."</br>После опять повернулся к лейтенантам и на повышенном тоне сказал:</br>— "Есть ещё бабуины, желающие посоревноваться в тупости, или будут нормальные предложения?"'],
    [2, '— "Готов выполнить любое распоряжение старших по званию!" — наконец отозвался Исраэль.'],
    [0, 'Морозов медленно повернул голову к Исраэлю, будто услышал что-то до боли знакомое и до боли раздражающее. Прищурился. Оглядел его с ног до головы — неспешно, издевательски, будто впервые в жизни видел человека в форме.</br></br>— "О-о-о" — протянул он с нарочитым восхищением. — "Какая строевая песня. Готов выполнить любое распоряжение старших по званию." — Он скривился, передразнивая.</br>Он подошёл ближе, сунул руки в карманы и наклонился к Исраэлю:</br></br>— "Любое распоряжение, значит. Любое-любое? А если я скажу вам прямо сейчас, вот здесь, на плацу, — копать отсюда до самого Будапешта, чтоб к утру была траншея? В виде пениса с сережками? Тоже готов?" — Он выпрямился, хмыкнул и уже спокойнее, но с той же язвительной усмешкой добавил: — "Заруби себе на носу, антисемитская карикатура: в этой части ценится не умение красиво отрапортовать, а умение думать, пока остальные рапортуют. Так что оставьте пафос для штабных бумажек." — Он махнул рукой в сторону турника: — "Раз такой готовый — вперёд. Подтягивания. Покажи комиссии, на что способен человек, который готов выполнить любое распоряжение"'],
    [0, 'Морозов стоял с видом человека, который уже приготовил язвительную отповедь, — но отповедь застряла у него в горле. Он смотрел, как Исраэль подтягивается раз за разом: чисто, ровно, без раскачки, подбородок над перекладиной — будто по линейке. Полковник даже приоткрыл рот, потом закрыл, потом машинально полез в карман за зажигалкой и щёлкнул крышкой. Раз. Другой.</br></br>— "Ну надо же," — наконец выдавил он, и в голосе вместо привычной язвительности прорезалось что-то вроде неохотного уважения. — "Оловянный солдатик, а не скрипит." — Он щёлкнул зажигалкой ещё раз и убрал её обратно. — "Ладно. Зачёл."</br></br>Лапин, напротив, просиял так, будто это он сам только что подтянулся. Он всплеснул руками — манерно, с растопыренными пальцами, — и повернулся к Батяеву:</br></br>— "Вот! Вот, товарищ генерал-лейтенант, полюбуйтесь!" — пропел он с приторным восторгом. — "Любо-дорого смотреть!" — Он повернулся к Исраэлю и послал ему широчайшую улыбку, ничуть не смущаясь. — "Браво, браво, дружище! Я в вас не сомневался ни секунды. Ни единой!"</br></br>Батяев же не спешил. Он стоял, поглаживая седую бороду, и в весёлых глазах его плясали искорки. Дождавшись, пока Лапин пропоёт своё, генерал неспешно подошёл к Исраэлю, положил ему на плечо тяжёлую, натруженную руку.</br></br>— "Ай да молодец, ай да сынок" — проговорил он бархатно, похлопал Исраэля по плечу и подмигнул. — "Ежели все у вас такие, то, глядишь, и вправду не зря налогоплательщики денежки отстёгивают." С небольшим укором посмотрел на Морозова Батяев.'],
    [0, 'Морозов смотрел на Сеняка, и лицо его медленно вытягивалось — сначала в изумление, потом в скорбь, потом в то особое выражение, с каким смотрят на сломавшуюся технику.</br></br>— "Это…" — он показал на Сеняка пальцем, будто на экспонат в кунсткамере, — "это что сейчас было? Это ты подтягивался или у тебя припадок?" — Он подошёл ближе, наклонился, заглянул снизу вверх, будто проверяя, живой ли. — "Я, грешным делом, думал, ты сейчас с перекладины свалишься и комиссию собой придавишь. Вот была бы история: генерал приехал — и его солдат задавил. В газетах бы написали: Суперсолдат не осилил турник" — Он выпрямился и театрально вздохнул, разводя руками. — "Ладно. Сойдёт за попытку гидроцефала вылезти из матки. Но запомни, Лунтик: если ты так же будешь воевать, как подтягиваешься, то противник умрёт — но исключительно от смеха."</br></br>Лапин, напротив, заулыбался ещё шире — если это вообще было возможно — и замахал руками, будто разгоняя морозовскую желчь:</br></br>— "Ну что вы, что вы, товарищ полковник! Строгость — это прекрасно, но давайте будем снисходительны!" — Он повернулся к Сеняку и лучисто улыбнулся. — "Дружище, вы не переживайте! Турник — это ведь не главное. Главное — дух! А дух, я вижу, у вас есть. А технику мы подтянем, да-с. Было бы желание, а техника — дело наживное. Я в вас верю."</br></br>Батяев же не стал ни ругать, ни хвалить. Он подошёл к Сеняку, погладил бороду, посмотрел на него внимательно, по-отцовски, и негромко, чтобы не слышала комиссия, проговорил:</br></br>— "Сынок, ты не расстраивайся. Иные с первого раза и вовсе не подтягиваются. Главное, сынок, не то, сколько ты подтянулся. Главное — что ты после этого не сдался. Понял меня?"'],
    [0, 'Морозов уже открыл рот, чтобы отпустить очередную шпильку, — и вдруг осёкся. Посмотрел на Щелочкова. Потом на перекладину. Потом опять на Щелочкова. И медленно, очень медленно закрыл рот.</br></br>— "Так" — сказал он наконец, и в голосе его не было ни капли привычной язвительности. — "Вот это уже интересно." — Он подошёл ближе, сунул руки в карманы, оглядел старшего лейтенанта с головы до ног. — "Я-то думал, у нас тут один Лунтик. А их, оказывается, целая дивизия." — Он проговорил с привычной вернувшейся язвительностью. Затем щёлкнул зажигалкой, посмотрел на огонёк, погасил. — "Только вот что, Щелочков. С тебя-то, командира, спрос другой. Ты ж за них всех отвечаешь. За Лунтиков этих." — Он кивнул в сторону Сеняка. — "Так что подтягивайся ты как хочешь. А вот их подтягивать — это уже твоя работа. Понял меня? Вот и хорошо." — Он отвернулся было, но добавил через плечо: — "И это… не позорься больше. Командир, который хуже своих бойцов подтягивается, — это как генерал без штанов. Смешно, но несолидно."</br></br>Лапин, наблюдавший за этим, сначала растерянно захлопал глазами, потом улыбка его стала совсем уж приторной — будто он съел целую банку мёда.</br></br>— "Ну вот! Ну вот и замечательно!" — пропел он, всплеснув руками. Его приторная улыбка быстро скатилась в выражение лица, сравнимое со стыдом за другого человека.</br></br>Батяев же смотрел на Щелочкова долгим, внимательным взглядом. Потом погладил бороду, усмехнулся в неё и негромко, так, чтобы слышал только сам Щелочков, проговорил:</br></br>— "А вот это, сынок, правильно." — Он подмигнул и хлопнул Щелочкова по плечу. — "Только в следующий раз, ежели уж подтягиваться, то подтягивайся как полагается"'],
    [0, '— "Возьму на себя роль тамады сегодняшнего вечера и сформирую дальнейшую программу" — привычно язвительно сказал комроты. — "Позвольте проводить вас в наш кабинет ОБЖ." — С чересчур наигранной вежливостью он уткнул руку в сторону двери, изогнувшись в шутовском полупоклоне.</br></br>Группа зашла в помещение, где парты уже были расставлены буквой П, а на них стелился брезент. На брезенте аккуратно лежали заваренные образцы АК-74М. Пара из них даже щеголяла сливовым цветом цевья и приклада.</br></br>Морозов достал из шкафа у входа секундомер — старый, потёртый, с треснувшим стеклом, — повертел его в пальцах и сделал заявление:</br></br>— "А теперь вам предстоит повторить подвиг Михаила Тимофеевича и собрать агрегат после разборки, которую тоже выполните вы. Впрочем, вы и так знаете, что делать." — Он сделал небольшую паузу, щёлкнул крышкой секундомера. — "Хотя…" — протянул с сомнением в голосе комроты, оглядывая строй. — "После сегодняшнего уже и не знаю"'],
    [0, 'Морозов пощёлкал секундомером, посмотрел на цифры, потом на Исраэля и Илью, потом опять на цифры — и лицо его сделалось кислым, как лимон.</br></br>— "Ну," — протянул он, — "норматив вы, конечно, выполнили. Поздравляю. Почти на грани, но выполнили." — Он убрал секундомер в карман и скрестил руки на груди. — "Правда, я, глядя на вас, всё думал: вот-вот наш кошерный деталь в карман сунет и скажет так и было. Но обошлось." — Он хмыкнул. — "Ладно. Зачёл. Не шедевр, но и не позор. Сойдёт." — И тут же развернулся к Игорю, и голос его сорвался на рык: — "А ты! Ты что творил?! Детали у тебя из рук сыпались, как горох из дырявого мешка! Я думал, ты не автомат собираешь, а поссать спохмела пытаешься!" — Он подскочил, ткнул пальцем в секундомер. — "В норматив ты не уложился, Лунтик! Не уложился! Да за такое время, что ты показал, я успел бы два раза автомат собрать, разобрать и еще десяток пендосов из него застрелить!" — Он выхватил у Игоря затворную раму, повертел в пальцах, будто проверяя, не сломал ли тот её. — "Слушай сюда, субстанция, напоминающая солдата. Автомат — это тебе не конструктор лего. Это оружие. И оно должно слушаться тебя с первого раза. Понял? Иначе в следующий раз я тебя самого разберу и соберу — и без секундомера."</br></br>Лапин всё это время стоял с неизменной улыбкой, но улыбка его слегка застыла. Он всплеснул руками, будто пытаясь разрядить обстановку:</br></br>— "Ну что вы, что вы, товарищ полковник!" — пропел он. — Не всё же сразу! Не всё сразу!"</br></br>Батяев же подошёл к Игорю неспешно, поглаживая бороду. Посмотрел на него сверху вниз, потом на автомат, потом опять на него. И негромко, без всякой язвительности, проговорил:</br></br>— "Сынок, ты не переживай так." — Он усмехнулся в бороду. — "Я вон в молодости тоже один раз затворную раму так уронил, что она под шкаф закатилась. Полдня потом всей ротой искали." — Он хлопнул Игоря по плечу. — "Так что не беда. Было бы желание. А желание, я вижу, есть. Вот и ладно. Вот и хорошо."'],
    [0, '— "Быстро эволюционируем в прямоходящих и марш в 345-й кабинет!" — рыкнул Морозов в приказном тоне. Развернулся — и, не сбавляя тона, повторил: — "Вы тоже"</br></br>От такого обалдели и генерал, и второй полковник — Батяев так и застыл с приоткрытым ртом, а Лапин растерянно захлопал ресницами, — но сказать что-то Морозову они не решились.</br></br>345-й кабинет был одним из кабинетов для занятий. Бойцы уселись по одному за парту. Комиссия села на заднюю левую, у окна. Морозов недолго пошуршал в одном из шкафов возле кафедры, затем гордо достал какие-то листки и громко заявил:</br></br>— "А сейчас безмозглые жуки-солдатики будут проходить тест, чтобы понять, сколько шестерёнок у них из башки высыпалось и могут ли жалкие остатки механизма выдать хоть что-то членораздельное" — как обычно, официозно и с язвительной интонацией проговорил полковник.</br></br>Затем, после оглашения торжественной речи, быстро отдал три листка бойцам. Бойцы поглядели, повертели листки и вернули взгляд на командира.</br></br>— "И что вы уставились на меня, как тряпичные куклы?" — начал было Морозов, но потом, поняв ситуацию, голос его стал тише и мягче: —" А, у вас ручек нету? Ну что за люди — ни мозгов, ни ручек"</br></br>Он раздал старые шариковые ручки — две синих и одну чёрную, — взятые с учительского стола, и сунул их бойцам.</br></br>— "Ну, ну, реще, реще!" — начал он подбадривать их злобным тоном. — "Запускаем процессы, которые ваша голова давно не испытывала"'],
    [2, 'Чихнул настолько сильно, что забрызгал тест не только соплями, но и кровью'],
    [1, 'Резко взяв ручку, принялся писать ответы на тест. Отвечая на один вопрос за другим на последнем Щелочков встал. Он очень долго и сильно раздумывал над ответом. На столько сильно, что он сжал в руках ручку так сильно, что она лопнула и забрызгала весь тест и соседей по партам'],
    [1, 'После ломания ручки забыл, как ее правильно держать'],
    [0, 'Морозов недолго наблюдал за представленным спектаклем, а потом решил вступить на сцену и сыграть свою партию.</br></br>— Ты зачем ручку сломал, душегуб?! — обрушился он на Илью истошным криком. — Тебя никто письменными принадлежностями пользоваться не учил?! Ты ожидал, что оттуда, как из пачки майонеза, чернила пойдут?! Незачёт!</br></br>Закончив разнос командира, он пошёл дальше по отряду. Посмотрел на листок Битона — и скривил гримасу такого отвращения, будто ему под нос сунули дохлую крысу. Уставился на автора живописи и начал рычать:</br></br>— Что это за биологический эксперимент на листке?! Тебя просили листок подписать. Под-пи-сать! — Членораздельно, нарочито выговаривая каждый слог, проговорил комчасти. — Это значит: фамилия, имя и отчество. Так зачем ты свой порядковый номер вместе с инфекциями написал?! Незачёт!</br></br>Уже весь разъярённый и красный, Морозов подошёл к Сеняку, который что-то бухтел, вчитывался, напрягался и пытался что-то написать в тесте.</br></br>— Время вышло, Лунтик! Показывай, что есть.</br></br>Молодой лейтенант протянул тест полковнику. Морозов выхватил листок и начал читать. Недолго ему пришлось искать ошибки. Он посмотрел, удивился, почесал нос и спокойно спросил:</br></br>— Ответь мне вот что: сколько у нас патронов в магазин помещается?</br></br>Игорь неуверенно:</br></br>— Какой магазин?</br></br>— Через дорогу ларёк с пивом который! — на слегка повышенных тонах сказал Морозов. — Автомата Калашникова, конечно же!</br></br>— Ну, тридцать, — ответил Игорь.</br></br>— «Ну, тридцать», — спародировал полковник лейтенанта, кривляясь. — Уверенно надо! А сколько магазинов вы по уставу должны таскать?</br></br>— Не менее восьми.</br></br>— И что, у тебя этот боекомплект весит тридцать шесть килограммов?</br></br>— Нет.</br></br>— Так какого хрена ты пишешь, что масса одного патрона — сто пятьдесят граммов?! У тебя весь магазин заряженный триста тридцать весит! — Кричал и брызгал слюной командир. Затем неожиданно спокойно заявил: — А впрочем, я тебе наглядно покажу.</br></br>После этой речи Морозов удалился из кабинета со словами:</br></br>— Ждите здесь.</br></br>Вечно улыбчивый Лапин переменился в лице — вместо улыбки на нём красовалась эмоция недоверия. Генерал лишь разочарованно произнёс:</br></br>— Да уж…</br></br>Дверь распахнулась, и там показалась фигура начальника части вместе с двумя гирями по восемнадцать килограммов, связанными канатом.</br></br>— Вот тебе боекомплект на твой скафандр, Лунтик. Как ты и рапортовал! — весело проговорил полковник, довольный своей находчивостью, и повесил конструкцию на шею лейтенанта. — До конца дня будешь ходить в этом, понял меня?! — вновь крикнул полковник. — Незачёт!</br></br>Остаток дня комиссия осматривала части под пристальным и язвительным присутствием Морозова.'],
    [0, 'Всё, казалось бы, шло своим чередом. Завтра — выезд на первое задание. Исраэль привычно набивал брюхо казённой выпечкой: два пирожка с вишней и компот на грушах. Игорь разминал плечи после вчерашнего обмундирования да почёсывал голову, вглядываясь в учебник. Илья всё не мог выкинуть из головы задание — продумывал ходы: а что, если будет так? А если этак? А вдруг никак не будет?</br></br>Мирную гармонию прервало громогласное:</br></br>— ПОГАДАГИ-И-И-И-И-ИН!</br></br>Судя по тембру голоса и по той лёгкости, с какой этот голос оповестил всю часть о виновнике неизвестной беды, принадлежало оно полковнику Морозову.'],
    [0, 'Предыдущий день.</br></br>Как только Погадагин узнал о своём увольнении в город на весь день — он сразу поскакал гладить форму. А поскольку получалось у него это не очень, за этим занятием его и застал вернувшийся с построения рядовой Сафонов.</br></br>— Амаду. Привет, слушай… — начал неуверенно рядовой. — Там это… я из-за всей этой суеты с заданием не успеваю отлучиться, письмо матери отправить. Ты, это… ну сможешь ей написать от меня?</br></br>— А что писать? — с неподдельным интересом спросил Погадагин, с явным акцентом якутских народностей.</br></br>— Ну, это… что у меня всё хорошо, жив-здоров.</br></br>— Ааа, ну это могу, — улыбнулся уволенный и сменил штанину на гладильной доске. Затем остановился, переменился в лице и выдал: — А кому писать?</br></br>— А, точно! — осёкся Сафонов. — Город Нижний Новгород, улица Берёзовская, дом двадцать четыре, квартира шесть. Индекс пять-шесть-семь-два-восемь-два.</br></br>— Эээ, ты это запиши, а то я не запомню, — отмахнулся якут.</br></br>— Да-да, сейчас, — замешкался молодой МТО-шник и спешно начал писать на листочке. — Вот! Сюда. А, конечно… — опять осёкся Сафонов, доставая из кармана купюру в пятьдесят рублей. — Вот, за письмо.</br></br>Погадагин долго бродил по городу, который до недавнего времени был украинским, да наблюдал за жизнью. А мирная жизнь, особо, не поменялась после занятия города русскими. Нет, конечно, дроны уже не летают да и не бомбят, но вот до СВО и сейчас особой разницы нет — разве что в каких-то номенклатурных делах. Молодой якут решил заточить две буханки хлеба, сидя в парке. Да так, будто его неделю не кормили, что аж прохожим становилось не по себе. Далее — игровые автоматы, всё в том же парке. Выиграл какого-то маленького мишку на аттракционе с тиром. Жвачку в автомате — да мало ли где погулял на свою скромную зарплату. Главное — в почтовое отделение.</br></br>Теперь там можно направить по адресу электронное письмо, которое уже печатается конвертом у адресата и доставляется. Автомат, как банкомат, — только толстый. Погадагин со второй попытки засунул купюру в аппарат, который поначалу не хотел принимать мятый листок. За пятьдесят рублей машина позволила написать лишь пятьдесят символов, так что Погадагин, немного поразмыслив, постарался сократить так, чтобы не исказить содержание. Далее — кнопка «отправить», и на том конце письмо уже в печати, а там и разноска до дома.</br></br>Вернувшись с увала под вечер, довольный Погадагин решает заскочить в столовую. Там сидят уставшие и явно замученные нормативами бойцы, среди которых — не менее уставший и замученный, но уже работой на складе рядовой Сафонов. Тот, увидя знакомое лицо, сразу оживляется и бежит к столику якута.</br></br>— Ну что, отправил? — с огоньком в глазах уставился рядовой.</br></br>— Отправил, отправил, — довольный и с важным видом произносит Погадагин.</br></br>Прошёл день. У КПП часового донимает невысокая и слегка полная женщина.</br></br>— Умоляю! Пустите меня! Мой сын ранен! — горячо и жалостно орала женщина.</br></br>— Успокойтесь! Никто не ранен, у нас даже учений не было, — с небольшим раздражением пытался успокоить гостью часовой.</br></br>— Пустите! Материнское сердце же чувствует! Что с ним? — всё не унималась просительница.</br></br>В этот момент на свою регулярную прогулку отправлялся полковник Морозов. Выйдя из здания КПП на внешнюю часть, он застал картину, как эта мадемуазель с двумя клетчатыми сумками пыталась пройти сквозь часового на территорию части.</br></br>— Гражданка? Вы что, знаков не видели? Это не ЖЭК районный, — с невозмутимостью, ему одновременно и свойственной, и несвойственной, отвалил полковник.</br></br>Увидев его, женщина сразу переключила фокус с бедного ефрейтора на погон выше.</br></br>— Умоляю, пустите меня, там сын мой!</br></br>— Отлично, ваш сын отдаёт долг родине. Чего ж вас пускать?</br></br>— Ранен он, умирает!</br></br>— У нас, гражданка, никто без моего разрешения умирать не имеет права! Не по уставу это. Да и потом, у нас ни заданий, ни учений не было. Только если он, дурачок, сам не сиганёт или не стрельнётся. Он же у вас не дурачок?</br></br>— Нет.</br></br>— Ну вот на том и порешили.</br></br>— Да ну как же, я же чувствую!</br></br>— Как ваша фамилия?</br></br>— Сафонова! Сын — Сафонов Лёшенька.</br></br>— Сафонов-Сафонов… — призадумался командир, вспоминая, где он слышал эту фамилию. — Так ваш сынулька ящики с тушёнкой на складе ворочает! Его даже на войну не отправляют, он тыловик! Как он ранение получит-то? — уже повышенно кричал в ответ полковник.</br></br>— Так… ну… — растерялась женщина. — Письмо же…</br></br>— Дайте сюда! — вырвал листок из рук Морозов и спешно развернул его. — «Ваш сын жив. Подробности письмом. Погадагин». — Потупив полсекунды, лицо полковника налилось краской, и он, глядя в небо, выдал истошное: — ПОГАДАГИ-И-И-И-ИН!</br></br>Затем, испустив воздух, вернул взгляд на женщину и злобным взглядом отрезал:</br></br>— Всё хорошо с вашим сыном, жив он и всё так же надоедает! А это… — он сделал агрессивный тычок пальцем в письмо, — …это послание чукчи для народа!</br></br>Растерянная женщина так и осталась стоять ошарашенной, с мятым листком в руках, провожая взглядом Морозова, яростно топающего назад.']

function pageLocal(){
  const legend = AUTHORS.map(a=>`<span class="${a.cls}" style="color:var(--ac)"><i style="background:var(--ac)"></i>${a.label}</span>`).join('');
  const tabs = LOCAL.map((t,i)=>`<button type="button" role="tab" id="tab${i}" aria-controls="panel${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-i="${i}">${t.tab}</button>`).join('');
  const panels = LOCAL.map((t,i)=>`<div class="panel story" role="tabpanel" id="panel${i}" aria-labelledby="tab${i}" ${i?'hidden':''}>
    <h2>${t.title}</h2>
    ${t.paras.map(([a,txt])=>`<p class="narr ${AUTHORS[a].cls}" data-author="${AUTHORS[a].label}">${txt}</p>`).join('')}
  </div>`).join('');
  return `<div class="pagehead"><span class="mono">История · Локальная</span><h1>Текстовая кампания</h1><p>Записи локальных событий между ивентами</p></div>
  <div class="legend" aria-label="Цвета авторов">${legend}</div>
  <div class="tabs" role="tablist" aria-label="Главы локальной истории">${tabs}</div>${panels}`;
}

function pageChars(){
  const N = {oreshkin:[25,25],teplinsky:[245,25],kozak:[465,25],batyaev:[245,120],solovyova:[25,215],krylov:[245,215],gulyaev:[465,215],vlad:[465,305],belkin:[50,313],ilya:[270,313],ptashkin:[25,398],yura:[245,398],somov:[25,483],denchik:[245,483]};
  const nodes = CHARS.map(c=>{const [x,y]=N[c.id];
    return `<a class="node g-${c.g}" href="#${c.id}" aria-label="Досье: ${c.nick}"><rect x="${x}" y="${y}" width="155" height="55"/><text x="${x+77.5}" y="${y+28}">${c.nick}</text></a>`}).join('');
  const lines = `<g class="ln">
    <path d="M180 52H245M465 52H400M322 80V120M322 175V195M102 195H542M102 195V215M322 195V215M542 195V215M542 270V305"/>
    <path d="M322 270V288M127 288H348M127 288V313M348 288V313"/>
    <path d="M205 340H220V510H180M220 425H180"/>

  <p class="hint desk">Линии показывают подчинение сверху вниз. Боковые связи наверху соединяют руководителей одного звена.</p>
  ${treeHTML()}`;
}

/* та же схема в виде вложенного списка для телефонов */
function treeHTML(){
  const tn = id=>`<a class="tnode g-${BY[id].g}" href="#${id}">${BY[id].nick}</a>`;
  const branch = id=>{
    const kids = DOWN.filter(([a])=>a===id).map(([,b])=>b);
    return `<li>${tn(id)}${kids.length?`<ul>${kids.map(branch).join('')}</ul>`:''}</li>`;
  };
  return `<div class="tree panel" aria-label="Схема персонажей списком">
    <div class="toprow">${['oreshkin','teplinsky','kozak'].map(tn).join('')}</div>
    <ul>${branch('batyaev')}</ul>
    <p class="hint">Вложенность показывает подчинение. Нажмите на имя, чтобы открыть досье.</p>
  </div>`;
}

function pageDossier(c){

    up.length?`<div><span class="mono">Выше по схеме</span>${up.map(chip).join('')}</div>`:'',
    down.length?`<div><span class="mono">Ниже по схеме</span>${down.map(chip).join('')}</div>`:'',

  const list = (t,a)=>`<section><h2>${t}</h2><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
  const ini = c.nick.slice(0,1);

  <div class="dos g-${c.g}">

      </dl>
      <div class="lists">${list('Класс',c.class)}${list('Характеристики',c.stats)}${list('Доп. навыки',c.effects)}${list('Образование',c.edu)}${list('Карьера',c.career)}${list('Предыстория',c.story)}</div>
      <div class="rel">${rel}</div>

  </div>`;
  if(c.pfp) return `<a class="back" href="#characters">← К схеме персонажей</a>
  <div class="dos g-${c.g}">
    <aside class="panel id">
      <img class="portrait" src="${c.image}">

      <span class="tag">Группа · ${GROUPS[c.g]}</span>
    </aside>
    <div style="min-width:0">
      <dl class="meta panel" style="padding:0">
        <dt>Имя</dt><dd>${c.name}</dd>
        <dt>Дата рождения</dt><dd>${fmtD(c.dob)} <span class="age">(${ageOf(c.dob)})</span></dd>

      <div class="rel">${rel}</div>
    </div>

  return `<a class="back" href="#characters">← К схеме персонажей</a>
  <div class="dos g-${c.g}">

/* ---------- СКАЧИВАНИЕ ---------- */
function briefText(){
  const ev = EVENTS.find(e=>e.now);
  return `# ${ev.y}: ${ev.t}\n\n${ev.d}\n\n## Хронология\n\n`+EVENTS.map(e=>`- ${e.y}. ${e.t}: ${e.d}`).join('\n')+'\n';
}
function charsJson(){
  return JSON.stringify(CHARS.map(c=>({имя:c.name,позывной:c.nick,группа:GROUPS[c.g],дата_рождения:fmtD(c.dob),возраст:ageOf(c.dob),место_рождения:c.pob,образование:c.edu,карьера:c.career,характер:c.char,внешность:c.look})),null,2);
}
const FILES = {brief:['svodka-leto-2032.md',briefText], chars:['dosye-personazhey.json',charsJson]};
const ERR = {declined:'Сохранение отменено.',rate_limited:'Подождите немного и повторите.',unavailable:'Скачивание недоступно в этом режиме просмотра.',not_granted:'Скачивание недоступно в этом режиме просмотра.'};
async function saveFile(key){
  const msg=$('#dl-msg'); const [name,gen]=FILES[key];
  try{
    const dl = await claude.use('downloads');
    if(!dl){msg.textContent='Скачивание недоступно в этом режиме просмотра.';return}
    const r = await dl.save({filename:name,data:gen()});
    msg.textContent = r.status==='saved' ? 'Файл сохранён: '+name : 'Файл передан.';
  }catch(e){ msg.textContent = ERR[e&&e.code] || 'Не удалось сохранить файл.'; }
}

/* ---------- РОУТЕР ---------- */
const view = $('#view');
function bind(page){
  if(page==='history-local'){
    const tabs=[...view.querySelectorAll('[role=tab]')];
    const show=i=>tabs.forEach((t,k)=>{const on=k===i;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$('#panel'+k).hidden=!on;if(on&&document.activeElement===tabs[k])t.focus()});
    tabs.forEach((t,i)=>{
      t.addEventListener('click',()=>{show(i);try{sessionStorage.setItem('tab',i)}catch(e){}});
      t.addEventListener('keydown',e=>{
        if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(n);tabs[n].focus()}
      });
    });
    try{const s=+sessionStorage.getItem('tab');if(s>0&&s<tabs.length)show(s)}catch(e){}
  }
  if(page==='history-global'){
    var tg = document.querySelector('.dl-toggle');
    document.querySelectorAll('.dl-toggle').forEach(tg => {
      tg.addEventListener('click',()=>{
        const l=tg.nextElementSibling;
        l.hidden=!l.hidden;
        tg.setAttribute('aria-expanded',!l.hidden)}
      );
      view.querySelectorAll('[data-file]').forEach(b=>b.addEventListener('click',()=>saveFile(b.dataset.file)));
    }
    )}
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1))||'home';
  let page='home', html;
  if(h==='history-global'){page=h;html=pageGlobal()}
  else if(h==='history-local'){page=h;html=pageLocal()}
  else if(h==='characters'){page=h;html=pageChars()}
  else if(BY[h]){page='character';html=pageDossier(BY[h])}
  else html=pageHome();
  view.innerHTML=html;
  const sect = page.startsWith('history')?'history':(page==='character'?'characters':page);
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===sect));
  document.querySelectorAll('[data-sub]').forEach(a=>a.classList.toggle('on',a.dataset.sub===page));
  $('#sub').hidden = sect!=='history';
  window.scrollTo(0,0);
  bind(page);
}
window.addEventListener('hashchange',route);
route();
</script>
