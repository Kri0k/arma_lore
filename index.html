<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Архив кампании</title>
<meta name="viewport-fit-sides" content="cover">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: консоль с липкой верхней панелью; контент идёт модулями с угловыми метками, схема персонажей — единый SVG. */
:root{
  --bg:#060b14; --bg-2:#0a1424; --panel:#0c1829; --panel-2:#12233d;
  --line:#1c3250; --line-2:#2f5280; --fg:#dbe8f7; --muted:#8fa6c2;
  --accent:#4fd0ff; --accent-ink:#021018; --glow:rgba(79,208,255,.35); --grid:rgba(79,208,255,.045);
  --c-blue:#5aa0e6; --c-green:#52c97c; --c-red:#ee6a73; --c-yellow:#f0c64a; --c-purple:#9d8df0;
  --a1:#8ff0b0; --a2:#46c978; --a3:#35ad68; --ay:#f0c64a;
  --f-head:'Tektur','Exo 2',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f9; --bg-2:#e2eaf4; --panel:#ffffff; --panel-2:#eaf1fa;
    --line:#c3d3e6; --line-2:#8fabc9; --fg:#0f1f33; --muted:#4c627d;
    --accent:#0077a8; --accent-ink:#ffffff; --glow:rgba(0,119,168,.25); --grid:rgba(0,119,168,.07);
    --c-blue:#2f6fb5; --c-green:#218a4a; --c-red:#c0414b; --c-yellow:#a77b00; --c-purple:#6a56c9;
    --a1:#3f9a63; --a2:#1f7a42; --a3:#0e5a2d; --ay:#8a6700;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f9; --bg-2:#e2eaf4; --panel:#ffffff; --panel-2:#eaf1fa;
  --line:#c3d3e6; --line-2:#8fabc9; --fg:#0f1f33; --muted:#4c627d;
  --accent:#0077a8; --accent-ink:#ffffff; --glow:rgba(0,119,168,.25); --grid:rgba(0,119,168,.07);
  --c-blue:#2f6fb5; --c-green:#218a4a; --c-red:#c0414b; --c-yellow:#a77b00; --c-purple:#6a56c9;
  --a1:#3f9a63; --a2:#1f7a42; --a3:#0e5a2d; --ay:#8a6700;
  color-scheme:light;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 16px/1.65 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.1}
.mono{font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:800 1rem/1 var(--f-head);letter-spacing:.14em;display:block}
.brand span{font:400 .66rem/1.2 var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main a,.sub a{
  font:600 .82rem/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
  padding:10px 14px;border:1px solid transparent;color:var(--muted);transition:color .2s,border-color .2s,background .2s
}
nav.main a:hover,.sub a:hover{color:var(--fg);border-color:var(--line-2)}
nav.main a.on,.sub a.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:0 0 14px -4px var(--glow)}
.sub{background:var(--bg);border-bottom:1px solid var(--line)}
.sub .wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-block:8px}
.sub .mono{margin-right:8px}

main{padding-block:36px 72px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:24px}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.pagehead{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:72ch}
.pagehead h1{font-size:clamp(1.9rem,4.6vw,3rem);font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.pagehead p{margin:0;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:32px;align-items:center;padding-block:12px 40px}
.hero h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.hero h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 28px var(--glow)}
.hero p{max-width:52ch;color:var(--muted);font-size:1.05rem;margin:20px 0 0}
.status{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;padding:6px 12px;border:1px solid var(--line-2);font:500 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--c-green);box-shadow:0 0 10px var(--c-green);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
.logo{position:relative;width:100%;max-width:400px;justify-self:center;aspect-ratio:1}
.logo .glow{position:absolute;inset:-7%;border-radius:50%;background:radial-gradient(circle,rgba(60,130,255,.5),transparent 68%);animation:breathe 5s ease-in-out infinite}
.logo img,.logo svg,.logo .sweep{position:absolute;inset:0;width:100%;height:100%;display:block}
.logo .sweep{border-radius:50%;background:conic-gradient(from 0deg,transparent 0 78%,rgba(150,220,255,.6) 94%,transparent 100%);-webkit-mask:radial-gradient(circle closest-side,transparent 64%,#000 65%,#000 92%,transparent 93%);mask:radial-gradient(circle closest-side,transparent 64%,#000 65%,#000 92%,transparent 93%);mix-blend-mode:screen;animation:turn 12s linear infinite}
.logo .fib{fill:none;stroke:#9fe7ff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 93;stroke-dashoffset:7;opacity:0;filter:drop-shadow(0 0 7px #4fd0ff);animation:pulse 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.logo .ping{fill:none;stroke:#9fe7ff;stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 4.2s ease-out infinite;animation-delay:var(--d,0s)}
.logo .base{fill:none;stroke:#9fe7ff;stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center;animation:basepulse 4.2s ease-out infinite}
@keyframes pulse{0%{stroke-dashoffset:7;opacity:0}8%{opacity:1}62%{opacity:1}70%{stroke-dashoffset:-93;opacity:0}100%{stroke-dashoffset:-93;opacity:0}}
@keyframes ping{0%,64%{opacity:0;transform:scale(.7)}67%{opacity:.9}92%,100%{opacity:0;transform:scale(2.6)}}
@keyframes basepulse{0%{opacity:.9;transform:scale(1)}28%,100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:.5}}
@keyframes turn{to{transform:rotate(360deg)}}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.mod{display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;transition:transform .2s,border-color .2s}
.mod:hover{transform:translateY(-3px);border-color:var(--accent)}
.mod h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em}
.mod p{margin:0;color:var(--muted);font-size:.95rem}
.mod .go{margin-top:auto;padding-top:10px;font:600 .78rem/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mod .n{font:800 2.6rem/1 var(--f-head);color:var(--accent);text-shadow:0 0 22px var(--glow)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:18px}
.tl::before{content:"";position:absolute;left:13px;top:20px;bottom:6px;width:2px;background:linear-gradient(var(--line-2),var(--accent))}
.ev{position:relative;padding-left:48px;min-width:0}
.ev::before{content:"";position:absolute;left:4px;top:22px;width:16px;height:16px;background:var(--bg);border:2px solid var(--line-2);transform:rotate(45deg)}
.ev .card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;min-width:0}
.ev .yr{font:600 .8rem/1 var(--f-mono);letter-spacing:.16em;color:var(--accent)}
.ev h3{font-size:1.25rem;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.ev p{margin:0;color:var(--muted);max-width:108ch}
.ev.future::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
.ev.nafofuture::before{background: #65ff4f;border-color: #76ff4f;box-shadow: 0 0 18px rgba(101, 255, 79, 0.35);}
.ev.nafo::before{border-color: #76ff4f}
.ev.now::before{border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
.ev.now .card{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%);box-shadow:0 0 34px -12px var(--glow);padding:24px}
.ev.future .card{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%);box-shadow:0 0 34px -12px var(--glow);padding:24px}
.ev.future .card{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%);box-shadow:0 0 34px -12px var(--glow);padding:24px}
.ev.future h3, .ev.nafofuture h3{font-size:1.7rem}
.ev.future p, .ev.nafofuture p{color:var(--fg)}
.ev.nafo .card, .ev.nafofuture .card {background: linear-gradient(135deg,color-mix(in srgb,#55ff4f 14%,var(--panel)),var(--panel) 70%);}
.ev.nafofuture .card{border-color:#55ff4f}
.badge{display:inline-block;margin-left:10px;padding:3px 8px;background:var(--accent);color:var(--accent-ink);font:600 .64rem/1 var(--f-mono);letter-spacing:.14em}
.ev.nafo .badge, .ev.nafofuture .badge {background-color: #55ff4f;}
.ev.nafo .yr, .ev.nafofuture .yr {color: #55ff4f;}
.btn{justify-self:end;width:fit-content;text-decoration:none;display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:12px 30px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;font:700 .85rem/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;transition:box-shadow .2s,transform .2s}
.btn:hover{box-shadow:0 0 22px var(--glow);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:0;padding:9px 20px}
.ev.nafo .btn{background-color:#55ff4f}
.ev.nafo .btn:hover{box-shadow:0 0 22px #55ff4f}
.ev.nafo .btn.ghost{background:transparent;color:#55ff4f;border-color:#55ff4f;}
.dl{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.dl .row{display:grid;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line-2);background:var(--panel);grid-template-columns:1fr 1fr;}
.ev.nafo .dl .row{border-color: #55ff4f;}
.dl .row b{font-weight:600}
.dl .row small{display:block;color:var(--muted);font:400 .75rem/1.3 var(--f-mono)}
.dlmsg{margin-top:10px;min-height:1.4em;font:400 .85rem/1.4 var(--f-mono);color:var(--muted)}

/* local history */
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:20px;padding:14px 18px;border:1px dashed var(--line-2)}
.legend span{display:inline-flex;align-items:center;gap:8px;font:500 .8rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.legend i{width:12px;height:12px;display:inline-block}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;position:relative;z-index:1}
.tabs button{font:600 .82rem/1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;padding:13px 18px;background:var(--bg-2);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--accent);border-color:var(--line-2);border-bottom-color:var(--panel)}
.story{display:flex;flex-direction:column;gap:16px;max-width:80ch}
.story h2{font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em}
.story p{margin:0}
.narr{position:relative;padding:12px 16px 12px 18px;border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 9%,transparent);color:var(--ac)}
.narr::before{content:attr(data-author);display:block;margin-bottom:4px;font:500 .66rem/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.author-green-1{--ac:var(--a1)}
.author-green-2{--ac:var(--a2)}
.author-green-3{--ac:var(--a3)}
.author-yellow{--ac:var(--ay)}

/* characters */
.legendc{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:16px}
.legendc span{display:inline-flex;align-items:center;gap:8px;font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legendc i{width:12px;height:12px;background:var(--gc);display:inline-block}
.schemewrap{padding:12px}
.scheme{display:block;width:100%;min-width:560px;height:auto}
.scheme .ln{stroke:var(--line-2);stroke-width:2;fill:none}
.node{cursor:pointer;outline:none}
.node rect{fill:color-mix(in srgb,var(--gc) 20%,var(--panel));stroke:var(--gc);stroke-width:2;transition:fill .2s,filter .2s}
.node text{fill:var(--fg);font:600 17px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node:hover rect,.node:focus-visible rect{fill:color-mix(in srgb,var(--gc) 42%,var(--panel));filter:drop-shadow(0 0 8px var(--gc))}
.node:focus-visible rect{stroke-width:4}
.g-blue{--gc:var(--c-blue)} .g-green{--gc:var(--c-green)} .g-red{--gc:var(--c-red)} .g-yellow{--gc:var(--c-yellow)} .g-purple{--gc:var(--c-purple)}
.hint{margin:14px 0 0;color:var(--muted);font-size:.9rem}

/* dossier */
.back{display:inline-flex;gap:8px;margin-bottom:18px;font:600 .8rem/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--accent)}
.back:hover{text-shadow:0 0 12px var(--glow)}
.dos{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
.id{display:flex;flex-direction:column;gap:14px;border-color:var(--gc)}
.id::before,.id::after{border-color:var(--gc)}
.portrait{aspect-ratio:4/5;max-width:100%;width:100%;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--gc) 8%,transparent) 3px 4px),color-mix(in srgb,var(--gc) 10%,var(--bg));border:1px solid var(--gc);display:block}
.id h1{font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em}
.tag{align-self:flex-start;padding:4px 9px;border:1px solid var(--gc);color:var(--gc);font:500 .68rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.meta{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0;border:1px solid var(--line)}
.meta dt,.meta dd{margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.meta dt:last-of-type,.meta dd:last-of-type{border-bottom:0}
.meta dt{font:500 .72rem/1.6 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
.meta dd{font-weight:500}
.meta dd .age{font-family:var(--f-mono);color:var(--accent)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px;margin-top:16px}
.lists section{min-width:0;border:1px solid var(--line);padding:16px 18px;background:var(--panel)}
.lists h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gc);margin-bottom:10px}
.lists ul{margin:0;padding-left:1.1em}
.lists li{margin:6px 0}
.lists li::marker{color:var(--gc)}
.rel{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.rel div{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:6px 12px;border:1px solid var(--gc);text-decoration:none;font-weight:500;font-size:.9rem;background:color-mix(in srgb,var(--gc) 14%,transparent)}
.chip:hover{background:color-mix(in srgb,var(--gc) 34%,transparent)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* мобильное дерево персонажей (на широких экранах скрыто) */
.tree{display:none}
.tree .toprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tree ul{list-style:none;margin:0;padding:0}
.tree li{position:relative;padding:5px 0 5px 18px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line-2)}
.tree li:last-child::before{bottom:auto;height:29px}
.tree li::after{content:"";position:absolute;left:0;top:29px;width:14px;border-top:2px solid var(--line-2)}
.tnode{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:1px solid var(--gc);background:color-mix(in srgb,var(--gc) 18%,var(--panel));color:var(--fg);text-decoration:none;font-weight:600}
.tnode::after{content:"›";margin-left:auto;color:var(--gc);font-size:1.4rem;line-height:1}
.tnode:active{background:color-mix(in srgb,var(--gc) 42%,var(--panel))}
.toprow .tnode{justify-content:center;padding:0 6px;font-size:.88rem;text-align:center}
.toprow .tnode::after{content:none}

@media (hover:none){
  .mod:hover{transform:none}
  .btn:hover{transform:none;box-shadow:none}
}

@media (max-width:760px){
  body{font-size:15.5px;background-size:32px 32px}
  main{padding-block:22px calc(104px + env(safe-area-inset-bottom,0px))}
  .panel{padding:18px}

  /* шапка: компактная, основная навигация уходит в нижнюю панель */
  .top .wrap{padding-block:8px}
  .brand svg{width:28px;height:28px}
  .brand b{font-size:.9rem}
  .brand span{display:none}
  nav.main{
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
    padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
    background:var(--bg-2);border-top:1px solid var(--line)
  }
  nav.main a{padding:15px 4px;text-align:center;font-size:.74rem;letter-spacing:.08em;border-color:var(--line)}
  .sub .wrap{gap:6px;padding-block:8px}
  .sub .mono{flex:0 0 100%;margin:0}
  .sub a{flex:1 1 0;text-align:center;padding:13px 8px;font-size:.76rem;border-color:var(--line)}

  /* главная */
  .hero{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:0 28px}
  .hero h1{font-size:clamp(2.1rem,11.5vw,3rem)}
  .hero p{font-size:1rem;margin-top:14px}
  .status{flex-wrap:wrap;gap:8px;line-height:1.4}
  .logo{max-width:240px;justify-self:start}
  .mods{gap:14px}
  .mod .n{font-size:2.2rem}
  .pagehead{margin-bottom:20px}

  /* хронология */
  .tl{gap:14px}
  .tl::before{left:6px}
  .ev{padding-left:34px}
  .ev::before{left:0;top:20px;width:14px;height:14px}
  .ev .card{padding:14px 16px}
  .ev h3{font-size:1.1rem}
  .ev.now .card{padding:18px}
  .ev.now h3{font-size:1.35rem}
  .badge{margin:6px 0 0;display:table}
  .ev.now .btn{width:100%;justify-content:center;min-height:48px}
  .dl .row{flex-direction:column;align-items:stretch}
  .dl .row .btn{width:100%;justify-content:center;min-height:46px}

  /* локальная история */
  .legend{gap:10px 16px;padding:12px 14px}
  .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}
  .tabs button{padding:14px 8px;font-size:.76rem;min-height:48px}
  .tabs button[aria-selected="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
  .story{gap:14px}
  .story h2{font-size:1.25rem}
  .narr{padding:12px 14px 12px 14px}

  /* персонажи: дерево вместо широкой схемы */
  .schemewrap,.hint.desk{display:none}
  .tree{display:block}
  .legendc{gap:8px 14px}

  /* досье */
  .back{padding:12px 0}
  .dos{grid-template-columns:minmax(0,1fr);gap:16px}
  .id{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:8px 16px;align-items:start}
  .id .portrait{grid-row:span 2}
  .id h1{font-size:1.3rem;overflow-wrap:anywhere}
  .meta{grid-template-columns:minmax(0,1fr)}
  .meta dt{border-bottom:0;padding:10px 14px 2px;background:transparent}
  .meta dd{padding:2px 14px 10px}
  .lists{gap:12px}
  .lists section{padding:14px 16px}
  .chip{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .logo *,.status i{animation:none!important}
  .logo .sweep,.logo .fib,.logo .ping,.logo .base{display:none}
  *{transition:none!important}
}

  {y:'2026', t:'Первое каление', d:'НАТО расширяется: Финляндия и Швеция уже в альянсе. Балтийское море становится де-факто внутренним морем блока. Калининград оказывается под постоянным давлением и провокациями. Россия отвечает на это размещением ракетоносителей "Искандер" в Беларуси. На фоне санкционного давления и технологического отставания Россия форсирует программу импортозамещения электроники и воскрешает из мертвых проект "Байкал". Китай становится главным технологическим партнером. Подписан "Шелковый путь 2" - соглашение о поставках китайских литографических станков, оптоволокна и технологий в сфере микроэлектроники в обмен на поставки газа и нефти по сниженным ценам.'},
  {y:'2027', t:'Новое правительство', d:'В США экономический кризис: госдолг достиг 50 трлн., запасы нефти истощаются, инфляция достигает 20%. Саудовская Аравия, за действия США на ближнем востоке, а также в качестве обеспечения безопасности своей экономики от штормующего доллара, переходит на юани в расчетах за нефть с Китаем. Доллар теряет статус единственной резервной валюты, что еще сильнее стимулирует рецессию в экономике. Внутри США рост политического экстремизма и сепаратизма спонсируемого демократической партией.</br></br>Путин, вместо назначения приемника, формирует Государственный Совет по Стратегическому Развитию (ГССР), в который входят ближайшее окружение из числа технократов:</br>• Теплинский Михаил Павлович - 48 лет. В двухтысячных воевал в Чечне. В 2014-м был "Вежливым зеленым человечком". В 2017-м получил медаль Героя России на посту главы ССО в Сирии. В 2020-м стал начальником управления ГРУ по спецоперациям. В 24-м стал заместителем президента по спецоперациям. Занял пост заместителя председателя ГССР в октябре 2027 г.</br>• Орешкин Максим Алексеевич - 54 года. Закончил МГУ и ВШЭ, стажировался в Goldman Sachs. В 2008-м занял пост аналитика в ВТБ, а затем в Роснефти. В 2013-м стал заместителем министра финансов Силуанова. В 2016-м получил должность министра экономического развития. С 2021-го находился на посту главы государственного совета по экономике. В 2027-м занял пост премьер-министра экономики в ГССР.</br>• Козак Дмитрий Степанович. Родился в 1958-м в Кировграде. Окончил Ленинградский Политехнический Институт и юрфак СПбГУ. В 80-е работал простым прокурором, но в лихие 90-е смог подняться до должности в мэрии при Собчаке. В нулевые перевелся в администрацию президента. В 2008-м стал вице-премьером по региональной политике. В 2018-м стал заместителем главы администрации президента по внешней политике. В 2027-м возглавил МИД в ГССР.</br>Сам Владимир Владимирович занял пост председателя совета.'},
  {y:'2028', t:'Польский инцидент и раскол США', d:'Российский СУ-34, перехвачен над приграничной территорией Калининграда под предлогом нарушения воздушного пространство Польши. Альянс вводит бесполетную зону над Калининградом, которую Россия не признает. Начинаются регулярные стычки и перехваты в воздухе. Путин все реже появляется в совете ГССР. Решения начинают приниматься коллегиально без его участия. Фактически новым лидером становится Теплинский, но формально Путин сохраняет свой пост.</br></br>В США прошли выборы, в которых одержала победу демократическая партия во главе с Камалой Харрис, решившей взять реванш. Республиканскую сторону представлял Марк Рубио при помощи Дональда Трампа. Однако республиканцы результаты не приняли и выдвинули претензии в фальсификации по знаменитой схеме "лесенки Байдена". Трамп не намерен сдавать пост демократам. Противоречия перерастают в митинги, а митинги в погромы. Точкой опоры новой оппозиции становится Техас.'},
  {y:'2029', t:'Богатыри и Днестровский кризис', d:'В начале года республиканцы отказываются передавать пост. Трампа арестовывают. Это приводит к еще большим протестам, которые не стесняются проявлять все жестче. Отдельные губернаторы республиканских штатов отказываются подчиняться новой власти. Молдова требует вывода российских войск с территории Приднестровья. При поддержке Румынии начинается блокада Тирасполя. Россия проводит частичную мобилизацию. НАТО перебрасывает 4-ю пехотную дивизию США в Румынию. Теплинский настаивает на жестком ответе, но не находит широкой поддержки в совете.</br></br>Россия начинает программу "Богатырь" - создание "суперсолдат" путем применения новых технологий в сфере биологии. Кандидатов выбирают из аллеи по гену ACTN3 (белок, отвечающий за структуру и функционирование мышечных волокон), устойчивостью к гипоксии (EPAS1), плотностью костей (LRP5). При помощи технологии CRISPR 3.0 эти белки усиливаются, ослабевают гены ответственные за накопление жира, снижается болевая чувствительность (SCN9A), повышается плотность митохондрий. При помощи фармакологии выводят модифицированный эритропоэтин (EPO) с контролируемым высвобождением - гематокрит 55-60%. Выводят селективные модуляторы андрогенных рецепторов SARM - усиление мышечной массы без стероидов и побочек. Иммуномодуляторы и Антиоксиданты получили невероятное улучшение.'},
  {y:'2030', t:'Вислинский инцидент и гражданская война в США', d:'ольский фрегат обстрелял российский сухогруз в Балтийском море, под предлогом подозрения в контрабанде. Россия выражает ноту протеста. Теплинский требует жесткого ответа - удар калибрами по базе ВМС Польши в Гдыне, однако недобирает небольшого процента голосов в ГССР. Путин все еще не появляется в совете. Готовиться приказ о назначении председателем Теплинского. Козак и Орешкин выдвигают свои кандидатуры в ответ.</br></br>В США фактическое двоевластие с республиканцами на юге и демократами на севере. Для восстановления единства штатов и подавления сепаратистов Камала подписывает документ о расширении полномочий полиции. В республиканские штаты направлены части нацгвардии и армии. Несогласные республиканцы отвечают силой. Начинается полномасштабная гражданская война без четкой линии фронта. Бои вспыхивают очагами как между частями армии, полиции, так и между простым гражданским населением.'},
  {y:'2031', t:'Две войны', d:'Теплинский становится новым председателем ГССР и фактическим главой государства. НАТО продолжает провокации. В ответ на них Россия наносит удар по базе НАТО в Редзиково. Начинается полномасштабная война. Китай занимает нейтралитет, все еще поддерживая торговые соглашения с обеими сторонами. Турция отказывается от 4-й статьи и закрывает проливы, также занимая нейтральную сторону и поддерживая тайную торговлю со всеми.</br></br>Техас объявил о выходе из состава США и провозгласил Великую Америку. В ВА также ушли Оклахома, Луизиана, Арканзас, Миссисипи, Миссури, Алабама, Теннесси и Кентукки. Поставки вооружения в Европу со стороны США прекращаются. Также отозваны все американские части, базирующиеся вне Америки.'},
  {y:'28 апреля 2031', t:'Польская прогулка', d:'Патруль польских сил привычно выходит на дежурство, однако этому дню суждено быть судьбоносным. Сначала найден ДРГ войск РФ, а затем и полномасштабное вторжение в Польский город Славтыче. Лишь один из трех участников патруля выжил и попал в плен.', nafo_polishwalk:true},
  {y:'Весна 2032', t:'Прорыв под Люблино', d:'Россия пользуется вакуумом и наступает в Польше, совершая прорыв под Люблином. НАТО теряет контроль над восточной Польшей. Сил Альянса не хватает для замещения американской логистики. Германия, Франция, Польша, Румыния, Австрия, Финляндия, Норвегия, Швеция, Черногория, Прибалтика и Приднестровье вводят режим чрезвычайного положения. Венгрия и Италия продолжают хранить молчание. Россия вязнет под Румынией.'},
  {y:'16 июля 2032', t:'Открытый нерв', d:'Румыния и Венгрия становятся главными узлами снабжения альянса. Через Венгрию идут поставки из Австрии. Линия фронта стабилизируется по линии Висла-Карпаты-Трансильвания. Теплинский подписывает секретную операцию "Открытый нерв" по перерезанию коридора поставок в городе Пюшпекладань. Для этой задачи выбираются суперсолдаты из свежей программы, что станет испытанием всей системы подготовки.', event_hungarianpie:true},
  {y:'18 июля 2032', t:'Пока ПЗРК', d:'Сразу после конца предыдущей миссии, еще не успевший вернуться отряд сразу выдергивают на следующее задание. Троицу забрасывают в тыл врага Польских войск, чтобы подорвать конвой с ПЗРК.', event_byepzrk:true},
  {y:'29 июля 2032', t:'Невидимая рука', d:'Концепция суперсолдат себя полностью оправдала! Сначала венгерский театр, затем диверсия в Польше, прорыв под Румынией и колонна под Варшавой. Во всех операциях, в которых применялись бойцы - успех неминуемо преследовал их. Теперь отряду "Богомол" вновь предстоит забраться в Польшу. Чтобы обеспечить успешный штурм в западной части страны, на позиции был выведен отряд с двумя САУ. Им предстоит отстрелять укрепления и технику противника, а затем поддержать штурм.', future:true}
];
